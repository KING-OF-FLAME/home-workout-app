name: Android APK

# Builds an installable test APK.
# - Every push to main (or this branch) builds the APK and keeps it as a run artifact.
# - Pushing a tag like v1.0.1, or running the workflow by hand with "release" ticked,
#   also publishes a GitHub release with the APK attached.
# The APK is signed with the default debug key: fine for testing, NOT for the Play Store.

on:
  push:
    branches: [main, claude/project-thread-qpkgpn]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the APK
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate data
        run: npm run check

      - name: Read app version
        id: version
        run: |
          echo "version=$(node -p "require('./config/app-config.json').app.version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./config/app-config.json').app.name")" >> "$GITHUB_OUTPUT"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: apk
        run: |
          FILE="${{ steps.version.outputs.name }}-v${{ steps.version.outputs.version }}-test.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) || github.ref == 'refs/heads/claude/project-thread-qpkgpn'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-test', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }} v${{ steps.version.outputs.version }} (test build)
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Test build of ${{ steps.version.outputs.name }} for Android.

            **Install:** download the APK below on your Android phone and open it. Allow "Install unknown apps" if asked.

            - Signed with a debug key: for testing only, not for the Play Store.
            - Coach features and banner ads stay off until Firebase keys and AdMob IDs are set in `config/app-config.json`.

            Built from commit ${{ github.sha }}.
