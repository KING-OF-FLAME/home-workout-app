name: Android APK

# Builds an installable test APK.
# - Every push to main (or this branch) builds the APK and keeps it as a run artifact.
# - Pushing a tag like v1.0.1, or running the workflow by hand with "release" ticked,
#   also publishes a GitHub release with the APK attached.
# The APK is signed with the default debug key: fine for testing, NOT for the Play Store.

on:
  push:
    branches: [main, claude/project-thread-qpkgpn]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the APK
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
      package: ${{ steps.version.outputs.package }}
      file: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate data
        run: npm run check

      - name: Read app version
        id: version
        run: |
          echo "version=$(node -p "require('./config/app-config.json').app.version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./config/app-config.json').app.name")" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p "require('./config/app-config.json').app.androidPackage")" >> "$GITHUB_OUTPUT"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Rename APK
        id: apk
        run: |
          FILE="${{ steps.version.outputs.name }}-v${{ steps.version.outputs.version }}-test.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30


  # Installs the APK on an Android emulator, opens it and fails if the app crashes.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r "${{ needs.build.outputs.file }}"
            adb logcat -c
            adb shell monkey -p ${{ needs.build.outputs.package }} -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt || true
            echo "----- crash lines -----"; grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Exception|Error:" logcat.txt | grep -v "chatty" | head -80 || true
            adb shell pidof ${{ needs.build.outputs.package }} > /dev/null || (echo "App is not running: it crashed on launch" && exit 1)
            echo "App is running after 30 seconds"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) || github.ref == 'refs/heads/claude/project-thread-qpkgpn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-test', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.name }} v${{ needs.build.outputs.version }} (test build)
          prerelease: true
          files: ${{ needs.build.outputs.file }}
          body: |
            Test build of ${{ needs.build.outputs.name }} for Android.

            **Install:** download the APK below on your Android phone and open it. Allow "Install unknown apps" if asked.

            - Signed with a debug key: for testing only, not for the Play Store.
            - Coach features and banner ads stay off until Firebase keys and AdMob IDs are set in `config/app-config.json`.

            Built from commit ${{ github.sha }}.
